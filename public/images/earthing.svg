    <pattern id="soil" width="40" height="32" patternUnits="userSpaceOnUse"><path d="m4 21 5-3m17-10 4 2" stroke="#a8a08f" stroke-width="1.4" stroke-linecap="round" opacity=".5"/></pattern>
    <pattern id="fill" width="23" height="23" patternUnits="userSpaceOnUse"><circle cx="5" cy="6" r="1.5" fill="#6b7982"/><circle cx="16" cy="16" r="1.2" fill="#6b7982"/></pattern>
    <linearGradient id="copper" x1="0" x2="1"><stop stop-color="#9b542f"/><stop offset=".44" stop-color="#e4a36b"/><stop offset=".66" stop-color="#d58c52"/><stop offset="1" stop-color="#a25a35"/></linearGradient>
  </defs>
