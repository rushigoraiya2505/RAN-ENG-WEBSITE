<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative chemical earthing arrangement</title>
  <desc id="desc">A flat cutaway illustration of a copper-toned electrode, connection clamp and backfill in soil. Conceptual illustration without engineering dimensions or ratings.</desc>
  <defs>
