  <rect x="48" y="48" width="1104" height="804" fill="url(#grid)" opacity=".58"/>
  <path d="M72 123V72h51M1077 72h51v51M1128 777v51h-51M123 828H72v-51" fill="none" stroke="#c1cedc" stroke-width="2"/>
